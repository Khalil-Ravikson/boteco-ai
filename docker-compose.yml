# =============================================================================
# docker-compose.yml — Boteco AI 🍻 (Com yt-dlp e Evolution 2.3.7)
# =============================================================================

networks:
  boteco:
    driver: bridge
    name: boteco_network

services:

  # ---------------------------------------------------------------------------
  # 1. Redis Stack (Memória e Fila do Celery)
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: boteco-redis
    restart: unless-stopped
    networks:
      - boteco
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: >
      redis-stack-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL (Exclusivo da Evolution API)
  # ---------------------------------------------------------------------------
  evolution-postgres:
    image: postgres:16-alpine
    container_name: boteco-postgres
    restart: unless-stopped
    networks:
      - boteco
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASS:-evo_pass_2024}
      - TZ=America/Sao_Paulo
    volumes:
      - evolution-pg-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 3. Evolution API v2.3.7 (Compilada do GitHub)
  # ---------------------------------------------------------------------------
  evolution-api:
    build:
      context: https://github.com/EvolutionAPI/evolution-api.git#2.3.7 
      dockerfile: ./Dockerfile
    image: evolution-api-local:2.3.7  
    container_name: boteco-evolution
    restart: unless-stopped
    networks:
      - boteco
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - TZ=America/Sao_Paulo

      # Travar versão do WhatsApp Web (Evita quedas de conexão)
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1032691661

      # Habilitar o Dashboard / Manager da Evolution
      - MANAGER_ENABLED=true

      # PostgreSQL
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASS:-evo_pass_2024}@evolution-postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false

      # Cache Redis DB 1
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://boteco-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false

      # Webhook (Mudei para o serviço "bot" e desliguei temporariamente)
      - WEBHOOK_GLOBAL_URL=http://bot:9000/webhook
      - WEBHOOK_GLOBAL_ENABLED=false   # <--- DEIXA FALSE PARA ELE FICAR CALADO
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true

    volumes:
      - ./evolution_instances:/evolution/instances
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      redis:
        condition: service_healthy
      evolution-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ---------------------------------------------------------------------------
  # 4. Boteco API (FastAPI)
  # ---------------------------------------------------------------------------
  bot:
    build: .
    container_name: boteco-api
    restart: unless-stopped
    networks:
      - boteco
    depends_on:
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    ports:
      - "9000:9000"
    volumes:
      - ./src:/app/src
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EVOLUTION_BASE_URL=http://evolution-api:8080
      - WHATSAPP_HOOK_URL=http://boteco-ai:9000/webhook
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 5. Celery Worker (O DJ e Fazedor de Figurinhas)
  # ---------------------------------------------------------------------------
  celery-worker:
    build: .
    container_name: boteco-worker
    restart: unless-stopped
    networks:
      - boteco
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - /tmp:/tmp  # CRÍTICO: Onde o yt-dlp guarda as músicas antes de enviar!
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EVOLUTION_BASE_URL=http://evolution-api:8080
      - TZ=America/Sao_Paulo
    command: celery -A src.infrastructure.celery_app.celery_app worker --loglevel=info --concurrency=2

volumes:
  redis-data:
    driver: local
  evolution-pg-data:
    driver: local